# Nav2 Parameters for RTABMap Integration
# =====================================
# 
# These parameters are optimized for differential robots using RTABMap SLAM
# Perfect for TurtleBot3 and similar differential drive robots
#
# Author: Mobile Robotics Engineer

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "differential"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    
    # DWB controller parameters (optimized for differential robots)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# Local costmap parameters
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        pointcloud:
          topic: /rtabmap/cloud_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True

# Global costmap parameters
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        pointcloud:
          topic: /rtabmap/cloud_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: true
    # The timeout must be greater than the transform timeout or else the `map_server` times out
    transform_timeout: 0.1
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# =====================================================
# RTAB-MAP UNIFIED PARAMETERS
# =====================================================
# Unified parameters for both Isaac Sim and D455 hardware
# Designed to achieve consistent mapping behavior
# Author: Mobile Robotics Engineer

rtabmap:
  ros__parameters:
    use_sim_time: true
    
    # === CORE SLAM CONFIGURATION ===
    frame_id: "camera_link"
    map_frame_id: "map"
    odom_frame_id: "camera_odom"          # Visual odometry only - no wheel dependency
    base_frame_id: "base_link"
    
    # === SUBSCRIPTION SETTINGS ===
    subscribe_stereo: true
    subscribe_odom_info: false            # DISABLE wheel odometry dependency
    subscribe_scan: false                 # DISABLE laser dependency for consistency
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_rgbd: false
    
    # === SYNCHRONIZATION ===
    approx_sync: true                     # More robust for real sensors
    queue_size: 50                        # Large buffer for processing delays
    
    # === VISUAL ODOMETRY PARAMETERS ===
    Vis/EstimationType: "1"               # 1=3D->2D (PnP) - more robust than 0=2D->3D
    Vis/MaxFeatures: "600"                # Balanced feature count (not too high for real sensors)
    Vis/MinInliers: "12"                  # Lower threshold for challenging environments
    Vis/InlierDistance: "0.15"            # More tolerant distance threshold
    Vis/RefineIterations: "5"             # Additional refinement iterations
    Vis/PnPReprojError: "8.0"             # Pixel reprojection error tolerance
    Vis/EpipolarGeometryVar: "0.02"       # Epipolar geometry variance
    
    # === STEREO PROCESSING ===
    Stereo/MaxDisparity: "96.0"           # Reduced for indoor environments
    Stereo/MinDisparity: "1.0"            # Avoid very close points
    Stereo/OpticalFlow: "true"            # Better feature tracking between frames
    Stereo/Eps: "0.01"                    # Stereo matching precision
    Stereo/Iterations: "30"               # More RANSAC iterations
    Stereo/MaxLevel: "3"                  # Pyramid levels for stereo
    
    # === CRITICAL: 2D MAPPING AND FLOOR DETECTION ===
    Grid/FromDepth: "true"                # Generate occupancy grid from stereo depth
    Grid/MaxObstacleHeight: "0.4"         # Only low obstacles (tables, chairs)
    Grid/MaxGroundHeight: "0.05"          # Very low ground detection threshold
    Grid/MinGroundHeight: "-0.05"         # Allow slight ground variations
    Grid/NormalK: "20"                    # Points for surface normal estimation
    Grid/GroundIsObstacle: "false"        # Don't mark ground as obstacle
    Grid/3D: "false"                      # Force 2D occupancy grid
    Grid/RayTracing: "true"               # Fill unknown space with ray tracing
    Grid/CellSize: "0.05"                 # 5cm grid resolution
    Grid/RangeMax: "5.0"                  # Maximum sensor range to consider
    Grid/RangeMin: "0.1"                  # Minimum sensor range
    Grid/ClusterRadius: "0.1"             # Cluster nearby points
    Grid/MinClusterSize: "10"             # Minimum cluster size
    Grid/FlatObstacleDetected: "true"     # Detect flat obstacles (important for floor)
    
    # === MEMORY MANAGEMENT ===
    Mem/RehearsalSimilarity: "0.4"        # More aggressive similarity threshold
    Mem/BadSignaturesIgnored: "false"     # Keep all observations for learning
    Mem/MapLabelsAdded: "true"            # Add semantic labels
    Mem/ReduceGraph: "false"              # Keep full pose graph
    Mem/IncrementalMemory: "true"         # Incremental learning
    Mem/InitWMWithAllNodes: "false"       # Don't load all nodes at start
    
    # === FEATURE DETECTION (ORB) ===
    Kp/MaxFeatures: "600"                 # Maximum features per image
    Kp/DetectorStrategy: "6"              # 6=ORB (robust and fast)
    Kp/NNStrategy: "1"                    # 1=FLANN (fast matching)
    Kp/WordsPerImage: "200"               # Visual words for bag-of-words
    Kp/BadSignRatio: "0.8"                # Feature quality threshold
    
    # === OPTIMIZATION ===
    Optimizer/Strategy: "1"               # 1=TORO, 0=GTSAM
    Optimizer/Slam2D: "true"              # Force 2D pose graph optimization
    Optimizer/Iterations: "20"            # Optimization iterations
    Optimizer/PixelVariance: "1.0"        # Pixel measurement variance
    Optimizer/RobustKernelDelta: "8.0"    # Robust kernel threshold
    
    # === REGISTRATION (ICP/Visual) ===
    Reg/Strategy: "1"                     # 1=Vis, 2=ICP, 0=Vis+ICP
    Reg/Force3DoF: "true"                 # Force 3DOF constraints (x,y,yaw)
    Reg/RepeatOnce: "true"                # Repeat registration once if failed
    
    # === LOOP CLOSURE DETECTION ===
    Rtabmap/DetectionRate: "1.0"          # Check every frame for loop closure
    Rtabmap/TimeThr: "0"                  # No time threshold
    Rtabmap/MemoryThr: "0"                # No memory threshold
    Rtabmap/LoopClosureReextractFeatures: "true"  # Re-extract features for LC
    
    # Loop closure parameters
    LccBow/MinInliers: "6"                # Lower inlier threshold
    LccBow/InlierDistance: "0.15"         # More tolerant distance
    LccBow/MaxResults: "10"               # Consider more candidates
    LccBow/EpipolarGeometryVar: "0.02"    # Epipolar constraint variance
    
    # === ROBUST PARAMETERS FOR REAL SENSORS ===
    RGBD/OptimizeMaxError: "4.0"          # More tolerant optimization error
    RGBD/ProximityBySpace: "true"         # Use spatial proximity
    RGBD/ProximityMaxGraphDepth: "50"     # Graph traversal depth
    RGBD/AngularUpdate: "0.1"             # Minimum angular change (rad)
    RGBD/LinearUpdate: "0.1"              # Minimum linear change (m)
    RGBD/LocalRadius: "10"                # Local map radius
    RGBD/OptimizeFromGraphEnd: "false"    # Don't optimize from end
    
    # === QUALITY THRESHOLDS ===
    Rtabmap/PublishStats: "true"          # Publish statistics
    Rtabmap/PublishLikelihood: "true"     # Publish localization likelihood
    Rtabmap/PublishPdf: "true"            # Publish probability maps
    Rtabmap/PublishLastSignature: "true"  # Publish last observation
    
    # === SPECIAL PARAMETERS FOR DIFFICULT ENVIRONMENTS ===
    Vis/CorNNType: "1"                    # 1=FLANN_LSH for binary features
    Vis/MaxDepth: "4.0"                   # Maximum depth to consider
    Vis/MinDepth: "0.1"                   # Minimum depth to consider
    Vis/RoiRatios: "0.03 0.03 0.04 0.04"  # ROI margins (left, right, top, bottom)
    
    # === DATABASE ===
    DbSqlite3/InMemory: "false"           # Use disk database
    DbSqlite3/CacheSize: "10000"          # Database cache size
    
    # === RTABMAP SPECIFIC ===
    rtabmap_args: "--delete_db_on_start --udebug"
    database_path: "~/.ros/rtabmap.db"